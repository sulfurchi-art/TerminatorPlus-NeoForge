# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment Properties
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# The NeoForge version the mod is compiled against. Keep it at the lower bound of neo_version_range
# so no API that only exists in newer NeoForge versions slips in.
neo_version=21.1.1
neo_version_range=[21.1.1,)
loader_version_range=[1,)

## Mod Properties
mod_id=terminatorplus
mod_name=TerminatorPlus
mod_license=EPL-2.0
mod_version=4.17.0-BETA
mod_group_id=net.nuggetmc.tplus
mod_authors=HorseNuggets (original Paper plugin)
